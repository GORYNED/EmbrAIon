framework:
  repository: GORYNED/EmbrAIon
  version: 0.30.0
  # Run `embraion update` after selecting a published release to materialize
  # the framework-owned artifact lock (release, exact wheel, verified SHA-256).

project:
  name: ExampleProject

capabilities: {}

# Automatic cleanup is opt-in; ownership checks cannot be disabled.
housekeeping:
  on-task-start: false
  local-branches: true
  remote-branches: false
  worktrees: true
  preserve-branches: []
