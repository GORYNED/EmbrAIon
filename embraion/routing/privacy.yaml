schema-version: 1
data-classes:
  PUBLIC:
    external-default: eligible
  PRIVATE:
    external-default: deny-unless-allowed
  CONFIDENTIAL:
    external-default: deny
rules:
  unknown-fails-closed: true
  taint-propagates: true
  automatic-downgrade: false
  privacy-before-ranking: true
  project-may-tighten: true
