site_name: EmbrAIon
site_description: Portable AI-First Engineering System for structured, reviewable AI-assisted software engineering.
site_author: GORYNED
site_url: https://embraion.goryned.com/
repo_url: https://github.com/GORYNED/EmbrAIon
repo_name: GORYNED/EmbrAIon
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/brand-mark.svg
  favicon: assets/favicon-brand-mark.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GORYNED/EmbrAIon
      name: EmbrAIon on GitHub
    - icon: fontawesome/solid/globe
      link: https://goryned.com
      name: GORYNED

copyright: EmbrAIon · AI-First Engineering System · by GORYNED

