site_name: EmbrAIon
site_description: AI-First Engineering System that gives software repositories a reusable project contract for structured, reviewable AI-assisted development.
site_author: GORYNED
site_url: https://embraion.goryned.com/
repo_url: https://github.com/GORYNED/EmbrAIon
repo_name: GORYNED/EmbrAIon
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/brand-mark.svg
  favicon: assets/favicon-brand-mark.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: false
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
          site_name: EmbrAIon
        - locale: ru
          name: Русский
          build: true
          site_name: EmbrAIon — документация
          nav_translations:
            Home: Главная
            Start Here: Начало работы
            Why EmbrAIon?: Зачем нужен EmbrAIon?
            EmbrAIon in 60 seconds: EmbrAIon за 60 секунд
            Five-minute sandbox: Песочница за пять минут
            Installation: Установка
            Add EmbrAIon to a project: Добавить EmbrAIon в проект
            Adopt an existing repository: Подключить существующий репозиторий
            Your first AI task: Первая задача для AI
            How it works: Как это работает
            FAQ: FAQ
            Glossary: Глоссарий
            Configure: Настройка
            Project Bootstrap: Начальная настройка проекта
            Overview: Обзор
            Basics: Основы
            Project knowledge: Знания проекта
            Policy & protected paths: Политика и защищённые пути
            Validation configuration: Настройка валидации
            Project agents: Агенты проекта
            Conversational configuration: Разговорная настройка
            Advanced: Расширенная настройка
            Project deployments: Deployments проекта
            Model routing: Маршрутизация моделей
            Execution & providers: Execution и провайдеры
            Pricing & cost: Pricing и стоимость
            Hosts: AI-хосты
            Portable bundle: Portable bundle
            Use: Использование
            Daily workflow: Ежедневный процесс
            Validation & evidence: Валидация и evidence
            Runs & review: Runs и ревью
            Troubleshooting: Решение проблем
            Examples: Примеры
            Reference: Справочник
            Engineering model: Инженерная модель
            CLI: CLI
            Runtime & version resolution: Runtime и разрешение версий
            Security & data flow: Безопасность и поток данных
            Security model: Модель безопасности
            Architecture: Архитектура
            Capability model: Модель возможностей
            Updating safely: Безопасное обновление
            Project: Проект
            Contributing: Участие в разработке
            Support: Поддержка
            Governance: Управление проектом
            Licensing: Лицензирование
            Maintainer reference: Для мейнтейнеров
            Security reporting: Сообщение об уязвимостях
            Release process: Процесс релиза
            Localization: Локализация

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GORYNED/EmbrAIon
      name: EmbrAIon on GitHub
    - icon: fontawesome/solid/globe
      link: https://goryned.com
      name: GORYNED

copyright: EmbrAIon · AI-First Engineering System · by GORYNED

