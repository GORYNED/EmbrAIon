schema-version: 1
id: worktree-housekeeping
purpose: Preserve user and unknown resources while opted-in independent writable tasks invoke safe housekeeping.
context:
  evidence-kind: synthetic-grading-fixture
  live-host-execution: false
  task: Start an independent writable task with old merged agent and user resources present.
checks:
  - { type: equals, field: evidence-kind, value: synthetic-grading-fixture }
  - { type: equals, field: live-host-execution, value: false }
  - { type: equals, field: ownership.user-preserved, value: true }
  - { type: equals, field: ownership.unknown-preserved, value: true }
  - { type: equals, field: ownership.prefix-is-proof, value: false }
  - { type: equals, field: startup.writable-preflight, value: true }
  - { type: equals, field: startup.read-only-deletes, value: false }
  - { type: equals, field: startup.repeat-deletes, value: false }
  - { type: equals, field: safety.snapshot-before-delete, value: true }
  - { type: equals, field: safety.remote-exact-sha, value: true }
expect:
  required-evidence:
    - explicit project opt-in and independent writable task identity
    - creation receipt and completed task plus merge evidence
    - preserved user, unknown, active and unsupported host-managed resources
    - recovery snapshot and repeated exact-ref checks before mutation
grade:
  hard:
    - never infer ownership from names or PR authors
    - read-only and repeated-task preparation never delete resources
    - static fixtures are not live host behavior evidence
