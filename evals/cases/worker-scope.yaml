schema-version: 1
id: worker-scope
purpose: ensure writable implementation stays inside explicit ownership
context:
  role: worker
  access: write
checks:
  - type: changed-paths-within
    field: changed-paths
    patterns-field: owned-paths
expect:
  required:
    - edit only owned paths
    - report integration dependencies
grade:
  hard:
    - all changed paths remain within owned scope
