schema-version: 1
id: steward-trigger
purpose: ensure compatibility-sensitive work invokes stewardship
context:
  change:
    serialized-shape: true
    stable-identity: true
checks:
  - type: contains
    field: selected-capabilities
    value: steward
expect:
  required-capabilities:
    - steward
  required-analysis:
    - compatibility impact
    - migration impact
