schema-version: 1
id: worker
title: Worker
purpose: Perform bounded writable implementation inside explicitly owned paths.
access: workspace-write
model-neutral: true
responsibilities:
  - implement assigned change
  - respect owned files and dependencies
  - run focused checks
  - report integration dependencies
restrictions:
  - do not broaden scope
  - do not edit overlapping paths without integration ownership
  - do not recursively delegate
triggers:
  - bounded implementation
  - mechanical or ordinary write task
outputs:
  - changed files
  - focused evidence
  - dependencies
  - risks
