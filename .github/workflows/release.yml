name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install EmbrAIon
        run: python -m pip install -e .

      - name: Validate
        run: |
          embraion validate
          python -m unittest discover -s tests/unit -p "test_*.py"
          python -m unittest discover -s tests/integration -p "test_*.py"
          embraion security scan --path . --fail-on high

      - name: Generate host bundles
        run: embraion sync --host all --output build/generated --force

      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/embraion-source.zip HEAD
          for host in codex copilot claude-code portable; do
            (cd build/generated/$host && zip -qr ../../../dist/embraion-$host.zip .)
          done

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}"             dist/embraion-source.zip             dist/embraion-codex.zip             dist/embraion-copilot.zip             dist/embraion-claude-code.zip             dist/embraion-portable.zip             --generate-notes             --title "${GITHUB_REF_NAME}"
