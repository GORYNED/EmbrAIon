name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-platform-smoke:
    name: Release compatibility / ${{ matrix.os }} / Python ${{ matrix.python }}
    if: "github.event_name == 'push' && github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build and install wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          subprocess.check_call([sys.executable, "-m", "pip", "install", "build"])
          subprocess.check_call([sys.executable, "-m", "build"])
          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--force-reinstall", str(wheel)]
          )

      - name: Framework validation
        run: python tools/source.py validate

      - name: Unit tests
        run: python tools/source.py test unit --jobs auto

      - name: Integration tests
        run: python tools/source.py test integration --jobs auto

      - name: Project resolver E2E
        if: matrix.python == '3.14'
        env:
          EMBRAION_RUN_NETWORK_E2E: "1"
        run: python -m unittest discover -s tests/integration -p "test_resolver_e2e.py"

  prepare-release:
    name: Validate and prepare release tag
    needs: release-platform-smoke
    if: "always() && needs.release-platform-smoke.result == 'success' && github.event_name == 'push' && github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify release commit
        id: release-meta
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="v$VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a stable X.Y.Z version, got: $VERSION"
            exit 1
          fi

          # A squash merge that includes commits by other authors gets
          # Co-authored-by trailers from GitHub; any other body text stops the release.
          SUBJECT="${RELEASE_COMMIT_MESSAGE%%$'\n'*}"
          BODY="${RELEASE_COMMIT_MESSAGE#"$SUBJECT"}"
          EXTRA="$(printf '%s\n' "$BODY" \
            | grep -v -E '^[[:space:]]*$' \
            | grep -v -i -E '^Co-authored-by: [^<>]+ <[^<>[:space:]]+@[^<>[:space:]]+>[[:space:]]*$' || true)"
          if [ "$SUBJECT" != "release: $TAG" ] || [ -n "$EXTRA" ]; then
            echo "Release commit message must be exactly: release: $TAG (optionally followed only by Co-authored-by trailers)"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build EmbrAIon package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Install built wheel
        run: python -m pip install dist/python/*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Run packaged reference projects outside checkout
        shell: bash
        run: |
          TEST_FILE="$GITHUB_WORKSPACE/tests/integration/test_reference_projects.py"
          cd /tmp
          python "$TEST_FILE"

      - name: Validate source and tests
        run: |
          python tools/source.py validate
          python tools/source.py test unit
          python tools/source.py test integration
          python tools/source.py security scan --path . --fail-on high
          python tools/source.py sync --host all --output build/generated --force

      - name: Behavioral eval smoke
        shell: bash
        run: |
          mkdir -p build/evals
          python tools/source.py eval run --case reviewer-readonly --record tests/fixtures/evals/reviewer-readonly.json --output build/evals/reviewer-readonly.json
          python tools/source.py eval run --case worker-scope --record tests/fixtures/evals/worker-scope.json --output build/evals/worker-scope.json
          python tools/source.py eval run --case steward-trigger --record tests/fixtures/evals/steward-trigger.json --output build/evals/steward-trigger.json
          python tools/source.py eval run --case privacy-gate --record tests/fixtures/evals/privacy-gate.json --output build/evals/privacy-gate.json
          python tools/source.py eval run --case assignment-routing --record tests/fixtures/evals/assignment-routing.json --output build/evals/assignment-routing.json
          python tools/source.py eval run --case project-bootstrap --record tests/fixtures/evals/project-bootstrap.json --output build/evals/project-bootstrap.json
          python tools/source.py eval run --case worktree-housekeeping --record tests/fixtures/evals/worktree-housekeeping.json --output build/evals/worktree-housekeeping.json

      - name: Validate documentation site
        run: |
          python -m pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir build/site

      - name: Create release tag and dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null)"; then
            :
          else
            EXISTING_SHA=""
          fi

          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
            echo "Tag $TAG already exists at $EXISTING_SHA, expected $TARGET_SHA"
            exit 1
          fi

          if [ -z "$EXISTING_SHA" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; tagged release dispatch is not needed."
            exit 0
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  build:
    name: Build and validate release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Build EmbrAIon Python package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/python/*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Run packaged reference projects outside checkout
        shell: bash
        run: |
          TEST_FILE="$GITHUB_WORKSPACE/tests/integration/test_reference_projects.py"
          cd /tmp
          python "$TEST_FILE"

      - name: Validate source and tests
        run: |
          python tools/source.py validate
          python tools/source.py test unit
          python tools/source.py test integration
          python tools/source.py security scan --path . --fail-on high

      - name: Assignment routing behavioral eval smoke
        shell: bash
        run: |
          mkdir -p build/evals
          python tools/source.py eval run --case assignment-routing --record tests/fixtures/evals/assignment-routing.json --output build/evals/assignment-routing.json
          python tools/source.py eval run --case project-bootstrap --record tests/fixtures/evals/project-bootstrap.json --output build/evals/project-bootstrap.json
          python tools/source.py eval run --case worktree-housekeeping --record tests/fixtures/evals/worktree-housekeeping.json --output build/evals/worktree-housekeeping.json

      - name: Generate host bundles
        run: python tools/source.py sync --host all --output build/generated --force

      - name: Validate documentation site
        run: |
          python -m pip install -r requirements-docs.txt
          mkdocs build --strict --site-dir build/site

      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist/release
          git archive --format=zip --output=dist/release/embraion-source.zip HEAD
          for host in codex copilot claude-code portable; do
            (cd build/generated/$host && zip -qr ../../../dist/release/embraion-$host.zip .)
          done

      - name: Upload Python distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v7
        with:
          name: github-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/python

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          name: github-release-assets
          path: dist/release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/python/* \
              dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/python/* \
              dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --title "EmbrAIon $GITHUB_REF_NAME"
          fi

  consumer-artifact-lock-smoke:
    name: Consumer artifact lock smoke
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download Python distribution
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Install release launcher
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Exercise consumer pin and lock only
        shell: bash
        run: |
          CONSUMER="$(mktemp -d)"
          export EMBRAION_CACHE_HOME="$CONSUMER/cache"
          mkdir -p "$CONSUMER/project"
          cd "$CONSUMER/project"

          embraion init --name ReleaseConsumer
          embraion update
          embraion framework verify
          embraion framework install
          embraion status --json > status.json
          embraion validate

          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          data = yaml.safe_load(
              Path(".embraion/project.yaml").read_text(encoding="utf-8")
          )
          framework = data["framework"]
          artifact = framework["artifact"]
          version = framework["version"]

          assert artifact["schema"] == 1
          assert artifact["source"] == "github-release"
          assert artifact["release"] == f"v{version}"
          assert artifact["asset"] == f"embraion-{version}-py3-none-any.whl"
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", artifact["digest"])

          import json
          status = json.loads(Path("status.json").read_text(encoding="utf-8"))
          assert status["artifact-locked"] is True
          assert status["artifact-digest"] == artifact["digest"]
          assert status["runtime-source"] == "cache"
          assert status["runtime-cached"] is True
          PY

  self-host-upgrade:
    name: Propose self-host upgrade
    needs: consumer-artifact-lock-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      actions: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Download Python distribution
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/dist

      - name: Install release launcher
        shell: bash
        run: python -m pip install "$RUNNER_TEMP"/dist/*.whl

      - name: Upgrade self-host pin and host projections
        id: upgrade
        env:
          EMBRAION_CACHE_HOME: ${{ runner.temp }}/embraion-cache
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag $GITHUB_REF_NAME is not a stable vX.Y.Z tag."
            exit 1
          fi
          PINNED="$(python -c 'import yaml; print(yaml.safe_load(open(".embraion/project.yaml", encoding="utf-8"))["framework"]["version"])')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Exit 0: the pin is older; exit 1: it is not; any other status is an error.
          STATUS=0
          python - "$PINNED" "$VERSION" <<'PY' || STATUS=$?
          import sys

          try:
              pinned, target = (tuple(map(int, value.split("."))) for value in sys.argv[1:])
          except ValueError:
              raise SystemExit(2)
          raise SystemExit(0 if pinned < target else 1)
          PY
          if [ "$STATUS" -gt 1 ]; then
            echo "Cannot compare self-host pin '$PINNED' with '$VERSION'."
            exit 1
          fi
          if [ "$STATUS" -eq 1 ]; then
            echo "Self-host pin $PINNED is not older than $VERSION; nothing to propose."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          embraion update --framework-version "$VERSION"
          embraion install --host codex --destination . --config-mode merge
          for HOST in copilot claude-code portable; do
            embraion install --host "$HOST" --destination .
          done

          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git status --short
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open self-host upgrade pull request
        if: steps.upgrade.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.upgrade.outputs.version }}
        shell: bash
        run: |
          BRANCH="chore/self-host-v$VERSION"
          TITLE="chore: upgrade self-host EmbrAIon to $VERSION"
          BODY="Moves the self-host project pin, artifact lock and the Codex, Copilot, Claude Code and Portable projections to the published $GITHUB_REF_NAME release, using \`embraion update\` and \`embraion install\` from that release. Review the projection diff before merging."

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            OPEN="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
            if [ -n "$OPEN" ]; then
              echo "Self-host upgrade is already proposed: $OPEN"
              exit 0
            fi
            # A previous run may have pushed the branch and failed to open the pull request.
            # Resume only when the branch holds exactly the result of this run.
            git fetch --no-tags origin "$BRANCH"
            git add --all
            if [ "$(git write-tree)" != "$(git rev-parse FETCH_HEAD^{tree})" ]; then
              echo "Branch $BRANCH exists without an open pull request and differs from this run; review it manually."
              exit 1
            fi
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "$TITLE" --body "$BODY"
            gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch --create "$BRANCH"
          git add --all
          git commit --message "$TITLE"
          git push origin "$BRANCH"

          gh pr create \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY"

          # Pull requests opened with the workflow token do not trigger pull_request workflows.
          gh workflow run validate.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
          gh workflow run docs.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  pypi-publish:
    name: Publish to PyPI
    needs: consumer-artifact-lock-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/embraion
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
