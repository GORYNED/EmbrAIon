name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Build EmbrAIon Python package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/python/*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Validate source and tests
        run: |
          embraion validate
          python -m unittest discover -s tests/unit -p "test_*.py"
          python -m unittest discover -s tests/integration -p "test_*.py"
          embraion security scan --path . --fail-on high

      - name: Generate host bundles
        run: embraion sync --host all --output build/generated --force

      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist/release
          git archive --format=zip --output=dist/release/embraion-source.zip HEAD
          for host in codex copilot claude-code portable; do
            (cd build/generated/$host && zip -qr ../../../dist/release/embraion-$host.zip .)
          done

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/python

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: github-release-assets
          path: dist/release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME"               dist/python/*               dist/release/*               --repo "$GITHUB_REPOSITORY"               --clobber
          else
            gh release create "$GITHUB_REF_NAME"               dist/python/*               dist/release/*               --repo "$GITHUB_REPOSITORY"               --generate-notes               --title "$GITHUB_REF_NAME"
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/embraion
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
