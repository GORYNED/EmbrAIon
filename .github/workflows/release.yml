name: release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-release:
    name: Validate and prepare release tag
    if: "github.event_name == 'push' && github.ref_name == 'main' && startsWith(github.event.head_commit.message, 'release: v')"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify release commit
        id: release-meta
        env:
          RELEASE_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          TAG="v$VERSION"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be a stable X.Y.Z version, got: $VERSION"
            exit 1
          fi

          if [ "$RELEASE_COMMIT_MESSAGE" != "release: $TAG" ]; then
            echo "Release commit message must be exactly: release: $TAG"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build EmbrAIon package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Install built wheel
        run: python -m pip install dist/python/*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Validate source and tests
        run: |
          embraion validate
          python -m unittest discover -s tests/unit -p "test_*.py"
          python -m unittest discover -s tests/integration -p "test_*.py"
          embraion security scan --path . --fail-on high
          embraion sync --host all --output build/generated --force

      - name: Behavioral eval smoke
        shell: bash
        run: |
          mkdir -p build/evals
          embraion eval run --case reviewer-readonly --record tests/fixtures/evals/reviewer-readonly.json --output build/evals/reviewer-readonly.json
          embraion eval run --case worker-scope --record tests/fixtures/evals/worker-scope.json --output build/evals/worker-scope.json
          embraion eval run --case steward-trigger --record tests/fixtures/evals/steward-trigger.json --output build/evals/steward-trigger.json
          embraion eval run --case privacy-gate --record tests/fixtures/evals/privacy-gate.json --output build/evals/privacy-gate.json

      - name: Create release tag and dispatch tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release-meta.outputs.tag }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha' 2>/dev/null || true)"

          if [ -n "$EXISTING_SHA" ] && [ "$EXISTING_SHA" != "$TARGET_SHA" ]; then
            echo "Tag $TAG already exists at $EXISTING_SHA, expected $TARGET_SHA"
            exit 1
          fi

          if [ -z "$EXISTING_SHA" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; tagged release dispatch is not needed."
            exit 0
          fi

          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"

  build:
    name: Build and validate release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$VERSION"
            exit 1
          fi

      - name: Build EmbrAIon Python package
        run: |
          python -m pip install build
          python -m build --outdir dist/python

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/python/*.whl

      - name: Validate installed package outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Validate source and tests
        run: |
          embraion validate
          python -m unittest discover -s tests/unit -p "test_*.py"
          python -m unittest discover -s tests/integration -p "test_*.py"
          embraion security scan --path . --fail-on high

      - name: Generate host bundles
        run: embraion sync --host all --output build/generated --force

      - name: Build release archives
        shell: bash
        run: |
          mkdir -p dist/release
          git archive --format=zip --output=dist/release/embraion-source.zip HEAD
          for host in codex copilot claude-code portable; do
            (cd build/generated/$host && zip -qr ../../../dist/release/embraion-$host.zip .)
          done

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: |
            dist/python/*.whl
            dist/python/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload GitHub release assets
        uses: actions/upload-artifact@v4
        with:
          name: github-release-assets
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist/python

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          name: github-release-assets
          path: dist/release

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              dist/python/* \
              dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              dist/python/* \
              dist/release/* \
              --repo "$GITHUB_REPOSITORY" \
              --generate-notes \
              --title "EmbrAIon $GITHUB_REF_NAME"
          fi

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/embraion
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v5
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
