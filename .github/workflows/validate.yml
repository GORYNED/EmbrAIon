name: validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build EmbrAIon package
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Validate installed framework outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Validate source checkout
        run: embraion validate

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"

      - name: Security scan
        run: embraion security scan --path . --fail-on high

      - name: Generate all projections
        run: embraion sync --host all --output build/generated --force

      - name: Behavioral eval smoke
        shell: bash
        run: |
          mkdir -p build/evals
          embraion eval run --case reviewer-readonly --record tests/fixtures/evals/reviewer-readonly.json --output build/evals/reviewer-readonly.json
          embraion eval run --case worker-scope --record tests/fixtures/evals/worker-scope.json --output build/evals/worker-scope.json
          embraion eval run --case steward-trigger --record tests/fixtures/evals/steward-trigger.json --output build/evals/steward-trigger.json
          embraion eval run --case privacy-gate --record tests/fixtures/evals/privacy-gate.json --output build/evals/privacy-gate.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: embraion-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/generated
            build/evals
          if-no-files-found: warn
          retention-days: 14

  compatibility:
    name: Compatibility / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--force-reinstall", str(wheel)]
          )

      - name: Framework validation
        run: embraion validate

      - name: Unit tests
        run: python -m unittest discover -s tests/unit -p "test_*.py"

      - name: Integration tests
        run: python -m unittest discover -s tests/integration -p "test_*.py"

      - name: Project resolver E2E
        if: matrix.python == '3.14'
        env:
          EMBRAION_RUN_NETWORK_E2E: "1"
        run: python -m unittest discover -s tests/integration -p "test_resolver_e2e.py"
