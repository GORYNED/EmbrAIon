name: validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build EmbrAIon package
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      - name: Validate installed framework outside checkout
        shell: bash
        run: |
          cd /tmp
          embraion validate

      - name: Validate source checkout
        run: python tools/source.py validate

      - name: Unit tests
        run: python tools/source.py test unit --jobs auto

      - name: Integration tests
        env:
          EMBRAION_PROJECTION_EVIDENCE_DIR: build/projection-evidence
        run: python tools/source.py test integration --jobs auto

      - name: Security scan
        run: python tools/source.py security scan --path . --fail-on high

      - name: Generate all projections
        run: python tools/source.py sync --host all --output build/generated --force

      - name: Behavioral eval smoke
        shell: bash
        run: |
          mkdir -p build/evals
          python tools/source.py eval run --case reviewer-readonly --record tests/fixtures/evals/reviewer-readonly.json --output build/evals/reviewer-readonly.json
          python tools/source.py eval run --case worker-scope --record tests/fixtures/evals/worker-scope.json --output build/evals/worker-scope.json
          python tools/source.py eval run --case steward-trigger --record tests/fixtures/evals/steward-trigger.json --output build/evals/steward-trigger.json
          python tools/source.py eval run --case privacy-gate --record tests/fixtures/evals/privacy-gate.json --output build/evals/privacy-gate.json
          python tools/source.py eval run --case assignment-routing --record tests/fixtures/evals/assignment-routing.json --output build/evals/assignment-routing.json
          python tools/source.py eval run --case project-bootstrap --record tests/fixtures/evals/project-bootstrap.json --output build/evals/project-bootstrap.json
          python tools/source.py eval run --case worktree-housekeeping --record tests/fixtures/evals/worktree-housekeeping.json --output build/evals/worktree-housekeeping.json

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: embraion-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/generated
            build/evals
            build/projection-evidence
          if-no-files-found: warn
          retention-days: 14

  reference-e2e:
    name: Reference projects E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Run packaged reference lifecycle outside checkout
        shell: bash
        run: |
          TEST_FILE="$GITHUB_WORKSPACE/tests/integration/test_reference_projects.py"
          cd /tmp
          python "$TEST_FILE"

  setup-action:
    name: Setup action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write a consumer project locked to a published release
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/consumer/.embraion"
          cat > "$RUNNER_TEMP/consumer/.embraion/project.yaml" <<'YAML'
          framework:
            repository: GORYNED/EmbrAIon
            version: 0.26.0
            artifact:
              schema: 1
              source: github-release
              release: v0.26.0
              asset: embraion-0.26.0-py3-none-any.whl
              digest: sha256:490bca7603db00478d18556c64ec791d5409857f4fbbd08062c029c7a98a0bfa
          YAML
          echo "CONSUMER=$RUNNER_TEMP/consumer" >> "$GITHUB_ENV"

      - name: Run the setup action from this checkout
        id: setup
        uses: ./actions/setup
        with:
          project-path: ${{ env.CONSUMER }}

      - name: Check the installed pin
        shell: bash
        env:
          INSTALLED_VERSION: ${{ steps.setup.outputs.version }}
          INSTALLED_DIGEST: ${{ steps.setup.outputs.digest }}
        run: |
          test "$INSTALLED_VERSION" = "0.26.0"
          test "$INSTALLED_DIGEST" = "sha256:490bca7603db00478d18556c64ec791d5409857f4fbbd08062c029c7a98a0bfa"
          embraion --version

  check-action:
    name: Check action
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Build and install wheel
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python -m pip install --force-reinstall dist/*.whl

      - name: Write a consumer project that declares both organization modes
        shell: bash
        run: |
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer/docs"
          cd "$consumer"
          git init --quiet --initial-branch main
          embraion init --name Consumer
          cat >> .embraion/policy.yaml <<'YAML'
          check:
            organization: [full, compare]
            fail-on: medium
            all-files: true
          YAML
          printf 'filenames:\n  roots: [docs]\n  extensions: [.md]\n' > .embraion/organization.yaml
          echo hello > docs/note.md
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit --quiet --message "Add the consumer project"
          echo "CONSUMER=$consumer" >> "$GITHUB_ENV"

      - name: Run the check action from this checkout
        uses: ./actions/check
        with:
          project-path: ${{ env.CONSUMER }}
          base-ref: HEAD

  compatibility:
    name: Compatibility / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python:
          - "3.11"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build

      - name: Install built wheel
        shell: python
        run: |
          import pathlib
          import subprocess
          import sys

          wheel = next(pathlib.Path("dist").glob("*.whl"))
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--force-reinstall", str(wheel)]
          )

      - name: Framework validation
        run: python tools/source.py validate

      - name: Unit tests
        run: python tools/source.py test unit --jobs auto

      - name: Integration tests
        run: python tools/source.py test integration --jobs auto

      - name: Project resolver E2E
        if: matrix.python == '3.14'
        env:
          EMBRAION_RUN_NETWORK_E2E: "1"
        run: python -m unittest discover -s tests/integration -p "test_resolver_e2e.py"
