[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embraion"
version = "0.2.2"
description = "Portable AI-First Engineering System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
]

[project.urls]
Homepage = "https://goryned.com"
Repository = "https://github.com/GORYNED/EmbrAIon"
Documentation = "https://github.com/GORYNED/EmbrAIon/tree/main/docs"

[project.scripts]
embraion = "embraion.cli:main"

[tool.setuptools.packages.find]
where = ["tools/cli"]
include = ["embraion*"]
