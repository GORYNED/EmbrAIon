[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embraion"
version = "0.28.0"
description = "Portable AI-First Engineering System"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.22,<5",
  "regex>=2024.0,<2027",
  "tomlkit>=0.13,<1",
]

[project.optional-dependencies]
litellm = ["litellm==1.77.7"]

[project.urls]
Homepage = "https://goryned.com"
Repository = "https://github.com/GORYNED/EmbrAIon"
Documentation = "https://embraion.goryned.com/"

[project.scripts]
embraion = "embraion.cli:main"

[tool.setuptools.packages.find]
where = ["tools/cli"]
include = ["embraion*"]
